openapi: 3.1.0
info:
  title: Expernet — API du prototype
  version: 0.1.0
  description: Catalogue public en lecture seule et API privée de collaboration authentifiée.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/formations/:
    get:
      operationId: listCourses
      summary: Résumés publics des 149 formations
      responses:
        '200':
          description: Catalogue destiné au filtre interactif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
  /api/sessions/:
    get:
      operationId: listSessions
      summary: Sessions publiques relevées au 22 octobre 2026
      responses:
        '200':
          description: Calendrier figé, sans garantie de disponibilité
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
  /api/palettes/:
    get:
      operationId: listPalettes
      summary: Quatre palettes, Océan étant retenue par défaut
      responses:
        '200':
          description: Valeurs des palettes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Palette'
  /api/discussions/inbox/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1inbox~1"
  /api/discussions/contacts/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1contacts~1"
  /api/discussions/history/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1history~1"
  /api/discussions/file/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1file~1"
  /api/discussions/administration/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1administration~1"
  /api/discussions/open/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1open~1"
  /api/discussions/send/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1send~1"
  /api/discussions/read/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1read~1"
  /api/discussions/permissions/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1permissions~1"
  /api/discussions/group/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1group~1"
  /api/discussions/meeting/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1meeting~1"
  /api/discussions/join/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1join~1"
  /api/discussions/ticket/:
    $ref: "./openapi-chat.yaml#/paths/~1api~1discussions~1ticket~1"
components:
  schemas:
    Course:
      type: object
      required: [id, title, slug, path, category, categories, duration, audience, image]
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        path: { type: string }
        category: { type: string }
        categories: { type: array, items: { type: string } }
        duration: { type: string }
        audience: { type: string }
        image: { type: string }
    Session:
      type: object
      required: [date, end, location, title, path, category]
      properties:
        date: { type: string, format: date }
        end: { type: string, description: Date ISO ou chaîne vide }
        location: { type: string }
        title: { type: string }
        path: { type: string }
        category: { type: string }
    Palette:
      type: object
      required: [id, name, title, blue, brand, ink, orange, cream, surface, description]
      properties:
        id: { type: string, enum: [signature, ocean, lumiere, expert] }
        name: { type: string }
        title: { type: string }
        blue: { type: string }
        brand: { type: string }
        ink: { type: string }
        orange: { type: string }
        cream: { type: string }
        surface: { type: string }
        description: { type: string }
