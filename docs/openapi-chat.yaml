                  },
                  "content": {
                    "type": "string",
                    "maxLength": 5000
                  },
                  "client_key": {
                    "type": "string",
                    "pattern": "^[a-zA-Z0-9-]{16,64}$",
                    "description": "Même clé et même contenu pour réessayer un envoi incertain."
                  },
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "10 Mo maximum. PDF, PNG, JPEG, TXT, DOCX, XLSX, PPTX sans macros ; antivirus obligatoire en production."
                  }
                },
                "required": [
                  "conversation_id",
                  "client_key"
                ]
              }
            }
          }
        }
