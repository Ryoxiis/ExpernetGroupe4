# Replace __PROJECT_ROOT__ with the absolute deployed directory.
# Local demonstration: access from the same machine only; do not expose real data over HTTP.
<VirtualHost *:80>
    ServerName expernet.local
    DocumentRoot "__PROJECT_ROOT__/public"
    DirectoryIndex index.php

    <Directory "__PROJECT_ROOT__/public">
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require local
        FallbackResource /index.php
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    php_admin_flag display_errors Off
    php_admin_flag log_errors On
    php_admin_value upload_max_filesize 10M
    php_admin_value post_max_size 12M

    ErrorLog ${APACHE_LOG_DIR}/expernet-error.log
    CustomLog ${APACHE_LOG_DIR}/expernet-access.log combined
</VirtualHost>
