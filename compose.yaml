services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      PORTAL_MFA: ${PORTAL_MFA:-true}
      CHAT_AV_BINARY: ${CHAT_AV_BINARY:-}
      CHAT_REQUIRE_SCAN: ${CHAT_REQUIRE_SCAN:-false}
      CHAT_WS_URL: ${CHAT_WS_URL:-}
      CHAT_MEETING_URL: ${CHAT_MEETING_URL:-}
      CHAT_MEETING_APP_ID: ${CHAT_MEETING_APP_ID:-}
      CHAT_MEETING_SECRET: ${CHAT_MEETING_SECRET:-}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-expernet}
      DB_USERNAME: ${DB_USERNAME:-expernet}
      DB_PASSWORD: ${DB_PASSWORD:-}

  database:
    image: mysql:8.4
    profiles: [database]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-expernet}
      MYSQL_USER: ${DB_USERNAME:-expernet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copier .env.example vers .env et choisir un mot de passe local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Choisir un mot de passe root local}
    volumes:
      - database_data:/var/lib/mysql

  chat:
    profiles: [collaboration]
    build:
      context: .
      dockerfile: docker/chat/Dockerfile
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      CHAT_WS_BIND: 0.0.0.0
      CHAT_WS_PORT: 8094
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-expernet}
      DB_USERNAME: ${DB_USERNAME:-expernet}
      DB_PASSWORD: ${DB_PASSWORD:-}
    restart: unless-stopped

volumes:
  database_data:
